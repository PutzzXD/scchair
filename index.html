<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Putzz Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0b1e3d;
            --blue-700: #1d4ed8;
            --blue-600: #2563eb;
            --blue-500: #3b82f6;
            --blue-100: #dbeafe;
            --blue-50: #eff6ff;
            --ink: #16213e;
            --slate: #5b6b8c;
            --slate-light: #94a3b8;
            --line: #e2e8f5;
            --white: #ffffff;
            --success: #0d9488;
            --success-bg: #ecfdf5;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --warn: #b45309;
            --warn-bg: #fffbeb;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 9px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 48px 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1100px 520px at 12% -8%, var(--blue-100) 0%, transparent 60%),
                radial-gradient(900px 480px at 100% 10%, #e8f0ff 0%, transparent 55%),
                linear-gradient(180deg, #f7faff 0%, #eef3fc 100%);
        }

        .shell { width: 100%; max-width: 480px; }

        .brandbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 0 4px;
        }
        .brandbar .mark {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: linear-gradient(145deg, var(--blue-600), var(--navy));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 17px;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 8px 20px -6px rgba(29, 78, 216, 0.45);
            flex-shrink: 0;
        }
        .brandbar .text h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.2px; color: var(--navy); }
        .brandbar .text p { font-size: 12px; color: var(--slate); font-weight: 500; }

        .card {
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(15, 30, 70, 0.04), 0 20px 45px -20px rgba(29, 63, 156, 0.18);
            padding: 28px 26px 26px;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .card-head h2 { font-size: 15px; font-weight: 700; color: var(--navy); }
        .card-head .pill {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--blue-700);
            background: var(--blue-50);
            border: 1px solid var(--blue-100);
            padding: 4px 10px;
            border-radius: 100px;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--slate);
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--line);
            background: #fbfcff;
            color: var(--ink);
            font-size: 14px;
            font-weight: 500;
            font-family: 'Plus Jakarta Sans', sans-serif;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--blue-500);
            background: #fff;
            box-shadow: 0 0 0 4px var(--blue-100);
        }
        .form-group input::placeholder { color: var(--slate-light); font-weight: 400; }
        #nomor, #unitValue { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.2px; }

        .toggle-group {
            display: flex;
            gap: 4px;
            background: var(--blue-50);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin-bottom: 14px;
        }
        .toggle-btn {
            flex: 1;
            padding: 8px 10px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--slate);
            font-weight: 700;
            font-size: 11.5px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        }
        .toggle-btn.active {
            background: var(--white);
            color: var(--blue-700);
            box-shadow: 0 1px 4px rgba(29, 78, 216, 0.18);
        }
        .toggle-btn:active { transform: scale(0.97); }

        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--blue-600), var(--blue-700));
            color: #fff;
            font-weight: 700;
            font-size: 13.5px;
            letter-spacing: 0.1px;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: 0 10px 22px -10px rgba(29, 78, 216, 0.55);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 26px -10px rgba(29, 78, 216, 0.6); }
        .btn:active { transform: translateY(0) scale(0.98); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

        .btn-sm {
            padding: 7px 14px;
            font-size: 11.5px;
            border-radius: 8px;
            width: auto;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .btn-danger-sm {
            background: transparent;
            color: var(--danger);
            border: 1.5px solid #fecaca;
            box-shadow: none;
        }
        .btn-danger-sm:hover { background: var(--danger-bg); box-shadow: none; transform: none; }

        .status {
            margin-top: 14px;
            padding: 11px 15px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-weight: 600;
            text-align: center;
            display: none;
        }
        .status.success { display: block; background: var(--success-bg); color: var(--success); border: 1px solid #a7f3d0; }
        .status.error { display: block; background: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca; }
        .status.loading { display: block; background: var(--warn-bg); color: var(--warn); border: 1px solid #fde68a; }

        .user-list {
            margin-top: 20px;
            max-height: 350px;
            overflow-y: auto;
            border-top: 1px solid var(--line);
            padding-top: 16px;
        }
        .user-list::-webkit-scrollbar { width: 5px; }
        .user-list::-webkit-scrollbar-track { background: transparent; }
        .user-list::-webkit-scrollbar-thumb { background: var(--blue-100); border-radius: 10px; }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 11px 13px;
            background: #fafbff;
            border-radius: var(--radius-sm);
            margin-bottom: 7px;
            border: 1px solid var(--line);
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .user-item:hover { border-color: var(--blue-500); background: #fff; }
        .user-item .info { font-size: 12.5px; color: var(--slate); min-width: 0; flex: 1; }
        .user-item .info .num { color: var(--navy); font-weight: 700; font-size: 13px; font-family: 'JetBrains Mono', monospace; }
        .user-item .info .role {
            color: var(--blue-700);
            font-size: 10px;
            font-weight: 700;
            background: var(--blue-50);
            padding: 1px 7px;
            border-radius: 100px;
            border: 1px solid var(--blue-100);
        }
        .user-item .info .name { color: var(--ink); font-weight: 600; }
        .user-item .info .exp { 
            font-size: 12px; 
            color: var(--slate-light); 
            margin-top: 2px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }
        .user-item .info .exp .timer { 
            color: var(--blue-700);
            font-weight: 700;
        }
        .user-item .info .exp .expired { 
            color: var(--danger);
            font-weight: 700;
        }
        .user-item .info .row1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

        .list-title {
            color: var(--slate);
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-title .count {
            color: var(--blue-700);
            font-weight: 700;
            background: var(--blue-50);
            border: 1px solid var(--blue-100);
            padding: 1px 9px;
            border-radius: 100px;
            font-size: 11px;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: var(--slate-light);
            margin-top: 22px;
            font-weight: 500;
        }
        .footer span { color: var(--blue-700); font-weight: 700; }

        /* ===== MODAL KEREN ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 55, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: modalFadeIn 0.25s ease;
        }
        .modal-overlay.active { display: flex; }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-box {
            max-width: 400px;
            width: 100%;
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 32px 28px 26px;
            box-shadow: 0 30px 70px rgba(15, 23, 55, 0.35);
            border: 1px solid var(--line);
            text-align: center;
        }
        .modal-box .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 6px;
        }
        .modal-box h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 4px;
        }
        .modal-box p {
            font-size: 14px;
            color: var(--slate);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .modal-box .highlight {
            font-family: 'JetBrains Mono', monospace;
            color: var(--navy);
            font-weight: 700;
            font-size: 15px;
            background: var(--blue-50);
            padding: 4px 12px;
            border-radius: 8px;
            display: inline-block;
            margin: 6px 0 12px;
            border: 1px solid var(--blue-100);
        }
        .modal-box .actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .modal-box .actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.12s ease;
        }
        .modal-box .actions button:active { transform: scale(0.96); }
        .modal-box .btn-cancel {
            background: var(--blue-50);
            color: var(--slate);
            border: 1px solid var(--line);
        }
        .modal-box .btn-cancel:hover { background: #e2e8f5; }
        .modal-box .btn-danger-modal {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 6px 18px -6px rgba(220, 38, 38, 0.35);
        }
        .modal-box .btn-danger-modal:hover { background: #b91c1c; }

        @media (max-width: 500px) {
            body { padding: 28px 14px; }
            .card { padding: 22px 18px 20px; border-radius: 16px; }
            .row { flex-direction: column; }
            .modal-box { padding: 24px 18px 20px; }
        }
    </style>
</head>
<body>

<div class="shell">
    <div class="brandbar">
        <div class="mark">P</div>
        <div class="text">
            <h1>Putzz Database</h1>
            <p>Panel kelola akun & masa aktif</p>
        </div>
    </div>

    <div class="card">
        <div class="card-head">
            <h2>Tambah / Perbarui Akun</h2>
            <span class="pill">Live sync</span>
        </div>

        <form id="formAdd">
            <div class="form-group">
                <label>Nomor WhatsApp</label>
                <input type="tel" id="nomor" placeholder="6281234567890" required>
            </div>
            <div class="form-group">
                <label>Nama pengguna</label>
                <input type="text" id="nama" placeholder="username" required>
            </div>
            <div class="form-group">
                <label>Level akses</label>
                <select id="role">
                    <option value="user">User</option>
                    <option value="premium">Premium</option>
                    <option value="admin">Admin</option>
                    <option value="owner">Owner</option>
                </select>
            </div>

            <div class="toggle-group" id="toggleGroup">
                <button type="button" class="toggle-btn active" data-unit="days">Hari</button>
                <button type="button" class="toggle-btn" data-unit="hours">Jam</button>
                <button type="button" class="toggle-btn" data-unit="minutes">Menit</button>
            </div>

            <div class="form-group">
                <label id="unitLabel">Durasi (hari)</label>
                <input type="number" id="unitValue" placeholder="30" value="30" min="1" required>
            </div>
            <div class="form-group">
                <label>Tanggal mulai</label>
                <input type="date" id="tanggal" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Simpan akun</button>
        </form>

        <div class="status" id="status"></div>

        <div class="user-list" id="userList">
            <div class="list-title">
                <span>📡 Daftar akun aktif</span>
                <span class="count" id="userCount">0</span>
            </div>
            <div id="userItems"></div>
        </div>
    </div>

    <div class="footer">
        <span>Putzz Database</span> · dikelola via Firebase
    </div>
</div>

<!-- ===== MODAL HAPUS KEREN ===== -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
        <span class="icon">🗑️</span>
        <h3>Hapus akun?</h3>
        <p>Akun ini akan dihapus permanen dari database.</p>
        <div class="highlight" id="modalNomor">6281234567890</div>
        <div class="actions">
            <button class="btn-cancel" id="modalCancel">Batal</button>
            <button class="btn-danger-modal" id="modalConfirm">Ya, hapus</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCARA9X8ZJdtQaD_3eSCRGJDn1BzdBp_DY",
        authDomain: "nilai-2aa04.firebaseapp.com",
        databaseURL: "https://nilai-2aa04-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "nilai-2aa04",
        storageBucket: "nilai-2aa04.firebasestorage.app",
        messagingSenderId: "545147756419",
        appId: "1:545147756419:web:6ad402531002e367e8a0b6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const form = document.getElementById('formAdd');
    const nomorInput = document.getElementById('nomor');
    const namaInput = document.getElementById('nama');
    const roleSelect = document.getElementById('role');
    const unitValue = document.getElementById('unitValue');
    const unitLabel = document.getElementById('unitLabel');
    const tanggalInput = document.getElementById('tanggal');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const toggleBtns = document.querySelectorAll('.toggle-btn');
    const userItems = document.getElementById('userItems');
    const userCount = document.getElementById('userCount');

    // Modal elements
    const modalOverlay = document.getElementById('deleteModal');
    const modalNomor = document.getElementById('modalNomor');
    const modalCancel = document.getElementById('modalCancel');
    const modalConfirm = document.getElementById('modalConfirm');
    let pendingDeleteNomor = null;

    let selectedUnit = 'days';
    let allUsers = {};
    let timerIntervals = {};

    toggleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            toggleBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedUnit = btn.dataset.unit;
            const labels = { days: 'Durasi (hari)', hours: 'Durasi (jam)', minutes: 'Durasi (menit)' };
            unitLabel.textContent = labels[selectedUnit];
        });
    });

    tanggalInput.value = new Date().toISOString().split('T')[0];

    function setStatus(msg, type) {
        statusDiv.textContent = msg;
        statusDiv.className = 'status ' + type;
    }

    // ===== FUNGSI HITUNG SISA WAKTU =====
    function getTimeRemaining(user) {
        const now = Date.now();
        const createdAt = user.createdAt || new Date(user.tanggal).getTime();
        let expiredMs = 0;

        if (user.expired_days) {
            expiredMs = user.expired_days * 24 * 60 * 60 * 1000;
        } else if (user.expired_hours) {
            expiredMs = user.expired_hours * 60 * 60 * 1000;
        } else if (user.expired_minutes) {
            expiredMs = user.expired_minutes * 60 * 1000;
        } else {
            expiredMs = 7 * 24 * 60 * 60 * 1000; // default 7 hari
        }

        const expiredTime = createdAt + expiredMs;
        const remaining = expiredTime - now;

        if (remaining <= 0) {
            return { expired: true, text: '⏰ EXPIRED' };
        }

        const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
        const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

        let text = '';
        if (days > 0) text = `${days}d ${hours}h ${minutes}m ${seconds}s`;
        else if (hours > 0) text = `${hours}h ${minutes}m ${seconds}s`;
        else if (minutes > 0) text = `${minutes}m ${seconds}s`;
        else text = `${seconds}s`;

        return { expired: false, text, remaining };
    }

    // ===== RENDER USERS =====
    function renderUsers() {
        const keys = Object.keys(allUsers);
        userCount.textContent = keys.length;

        if (keys.length === 0) {
            userItems.innerHTML = `<div style="text-align:center;color:#94a3b8;font-size:12.5px;padding:20px 0;">Belum ada akun tersimpan</div>`;
            return;
        }

        let html = '';
        keys.forEach(key => {
            const u = allUsers[key];
            const timeLeft = getTimeRemaining(u);
            const isExpired = timeLeft.expired;

            const roleEmoji = { owner: '👑', admin: '🛡️', premium: '💎', user: '👤' };
            const emoji = roleEmoji[u.role] || '👤';

            let expText = '';
            if (u.expired_days) expText = `${u.expired_days} hari`;
            else if (u.expired_hours) expText = `${u.expired_hours} jam`;
            else if (u.expired_minutes) expText = `${u.expired_minutes} menit`;

            const timerClass = isExpired ? 'expired' : 'timer';
            const timerText = isExpired ? '⏰ EXPIRED' : `⏳ ${timeLeft.text}`;

            // Generate unique ID untuk timer
            const timerId = `timer_${key}`;

            html += `
                <div class="user-item" data-nomor="${key}">
                    <div class="info">
                        <div class="num">${key}</div>
                        <div class="row1">
                            <span class="name">${emoji} ${u.nama || '-'}</span>
                            <span class="role">${(u.role || 'user').toUpperCase()}</span>
                        </div>
                        <div class="exp">
                            <span>${expText} · sejak ${u.tanggal || '-'}</span>
                            <br>
                            <span class="${timerClass}" id="${timerId}">${timerText}</span>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-danger-sm btn-sm" onclick="openDeleteModal('${key}')">Hapus</button>
                    </div>
                </div>
            `;
        });
        userItems.innerHTML = html;

        // ===== START TIMER UNTUK SETIAP USER =====
        startAllTimers();
    }

    // ===== START TIMER =====
    function startAllTimers() {
        // Hapus interval lama
        Object.values(timerIntervals).forEach(clearInterval);
        timerIntervals = {};

        const keys = Object.keys(allUsers);
        keys.forEach(key => {
            const u = allUsers[key];
            const timerId = `timer_${key}`;
            const el = document.getElementById(timerId);
            if (!el) return;

            // Update tiap detik
            timerIntervals[key] = setInterval(() => {
                const timeLeft = getTimeRemaining(u);
                if (timeLeft.expired) {
                    el.textContent = '⏰ EXPIRED';
                    el.className = 'expired';
                } else {
                    el.textContent = `⏳ ${timeLeft.text}`;
                    el.className = 'timer';
                }
            }, 1000);
        });
    }

    // ===== LOAD USERS =====
    function loadUsers() {
        db.ref('users').on('value', (snapshot) => {
            const data = snapshot.val();
            allUsers = data || {};
            renderUsers();
            localStorage.setItem('putzz_users', JSON.stringify(allUsers));
        });
    }

    // ===== MODAL FUNCTIONS =====
    window.openDeleteModal = function(nomor) {
        pendingDeleteNomor = nomor;
        modalNomor.textContent = nomor;
        modalOverlay.classList.add('active');
    };

    function closeDeleteModal() {
        modalOverlay.classList.remove('active');
        pendingDeleteNomor = null;
    }

    modalCancel.addEventListener('click', closeDeleteModal);
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeDeleteModal();
    });

    modalConfirm.addEventListener('click', async () => {
        if (!pendingDeleteNomor) return;
        const nomor = pendingDeleteNomor;
        closeDeleteModal();
        setStatus('Menghapus akun...', 'loading');
        try {
            await db.ref('users/' + nomor).remove();
            setStatus(`Akun ${nomor} berhasil dihapus.`, 'success');
        } catch (err) {
            setStatus('Gagal: ' + err.message, 'error');
        }
    });

    // ===== FORM SUBMIT =====
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nomor = nomorInput.value.trim().replace(/[^0-9]/g, '');
        const nama = namaInput.value.trim();
        const role = roleSelect.value;
        const value = parseInt(unitValue.value.trim()) || 1;
        const tanggal = tanggalInput.value;

        if (!nomor || nomor.length < 10) {
            setStatus('Nomor tidak valid', 'error');
            return;
        }
        if (!nama) {
            setStatus('Nama pengguna wajib diisi', 'error');
            return;
        }
        if (!tanggal) {
            setStatus('Tanggal wajib diisi', 'error');
            return;
        }

        submitBtn.disabled = true;
        setStatus('Menyimpan akun...', 'loading');

        try {
            const data = {
                nama: nama,
                role: role,
                tanggal: tanggal,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            };

            if (selectedUnit === 'days') data.expired_days = value;
            else if (selectedUnit === 'hours') data.expired_hours = value;
            else if (selectedUnit === 'minutes') data.expired_minutes = value;

            await db.ref('users/' + nomor).set(data);

            const unitText = {
                days: `${value} hari`,
                hours: `${value} jam`,
                minutes: `${value} menit`
            };
            setStatus(`Tersimpan: ${nama} (${nomor}) · ${unitText[selectedUnit]}`, 'success');
            form.reset();
            tanggalInput.value = new Date().toISOString().split('T')[0];
        } catch (err) {
            console.error(err);
            setStatus('Gagal menyimpan: ' + err.message, 'error');
        } finally {
            submitBtn.disabled = false;
        }
    });

    // ===== CACHE =====
    const cached = localStorage.getItem('putzz_users');
    if (cached) { try { allUsers = JSON.parse(cached); renderUsers(); } catch(e) {} }
    loadUsers();
</script>
</body>
</html>
