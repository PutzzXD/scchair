<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUTZZ DB · Cyber</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #05080f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Share Tech Mono', monospace;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(0,255,200,0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(255,0,200,0.03) 0%, transparent 60%),
                linear-gradient(rgba(0,255,200,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,200,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
        }
        .card {
            max-width: 520px;
            width: 100%;
            background: rgba(8,12,24,0.92);
            backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 32px 28px;
            border: 1px solid rgba(0,255,200,0.08);
            box-shadow: 0 0 60px rgba(0,255,200,0.02), 0 0 120px rgba(255,0,200,0.01);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(0,255,200,0.02) 0%, transparent 50%);
            animation: rotateBg 40s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateBg { 0%{transform:rotate(0);} 100%{transform:rotate(360deg);} }

        .glitch-line {
            position: relative;
            z-index: 2;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,255,200,0.15), transparent);
            margin: 0 -8px 18px;
        }

        .header {
            text-align: center;
            position: relative;
            z-index: 2;
            margin-bottom: 24px;
        }
        .header .icon { font-size: 38px; display: block; margin-bottom: 2px; filter: drop-shadow(0 0 20px rgba(0,255,200,0.1)); }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00ffc8, #00b894, #00ffc8);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 3s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(0,255,200,0.05);
        }
        @keyframes shimmer { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
        .header p { color: #4a5a7a; font-size: 11px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; }
        .header p span { color: #00ffc8; font-weight: 700; }
        .badge {
            display: inline-block;
            background: rgba(0,255,200,0.04);
            border: 1px solid rgba(0,255,200,0.06);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 8px;
            color: #4a8a7a;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group { position: relative; z-index: 2; margin-bottom: 14px; }
        .form-group label {
            color: #6a8a9a;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(0,255,200,0.04);
            background: rgba(0,0,0,0.4);
            color: #c0d8e0;
            font-size: 14px;
            font-weight: 400;
            outline: none;
            transition: 0.3s;
            font-family: 'Share Tech Mono', monospace;
            backdrop-filter: blur(4px);
        }
        .form-group input:focus, .form-group select:focus {
            border-color: rgba(0,255,200,0.2);
            box-shadow: 0 0 0 4px rgba(0,255,200,0.02), 0 0 30px rgba(0,255,200,0.02);
            background: rgba(0,0,0,0.6);
        }
        .form-group input::placeholder { color: #3a4a5a; font-weight: 400; }
        .form-group select option { background: #0a0e1a; color: #c0d8e0; }

        .toggle-group {
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 3px;
            border: 1px solid rgba(0,255,200,0.03);
            margin-bottom: 14px;
        }
        .toggle-btn {
            flex: 1;
            padding: 8px 10px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #4a5a6a;
            font-weight: 700;
            font-size: 10px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .toggle-btn.active {
            background: rgba(0,255,200,0.06);
            color: #00ffc8;
            border: 1px solid rgba(0,255,200,0.06);
            box-shadow: 0 0 20px rgba(0,255,200,0.02);
        }
        .toggle-btn:active { transform: scale(0.94); }

        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }

        .btn {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, rgba(0,255,200,0.08), rgba(0,255,200,0.02));
            color: #00ffc8;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(0,255,200,0.06);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }
        .btn:hover {
            background: rgba(0,255,200,0.04);
            border-color: rgba(0,255,200,0.15);
            box-shadow: 0 0 40px rgba(0,255,200,0.04);
            transform: translateY(-2px);
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        .btn-danger {
            background: rgba(255,50,50,0.04);
            border-color: rgba(255,50,50,0.06);
            color: #ff6b6b;
        }
        .btn-danger:hover {
            background: rgba(255,50,50,0.06);
            border-color: rgba(255,50,50,0.15);
            box-shadow: 0 0 40px rgba(255,50,50,0.04);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 10px;
            border-radius: 20px;
            width: auto;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 0.5px;
        }

        .status {
            position: relative;
            z-index: 2;
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            display: none;
            font-family: 'Share Tech Mono', monospace;
        }
        .status.success { display: block; background: rgba(0,255,200,0.04); color: #4ade80; border: 1px solid rgba(0,255,200,0.06); }
        .status.error { display: block; background: rgba(255,80,80,0.04); color: #f87171; border: 1px solid rgba(255,80,80,0.06); }
        .status.loading { display: block; background: rgba(255,215,0,0.03); color: #facc15; border: 1px solid rgba(255,215,0,0.04); }

        .user-list {
            position: relative;
            z-index: 2;
            margin-top: 18px;
            max-height: 280px;
            overflow-y: auto;
            border-top: 1px solid rgba(0,255,200,0.04);
            padding-top: 14px;
        }
        .user-list::-webkit-scrollbar { width: 3px; }
        .user-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .user-list::-webkit-scrollbar-thumb { background: rgba(0,255,200,0.1); border-radius: 10px; }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            margin-bottom: 6px;
            border: 1px solid rgba(0,255,200,0.02);
            transition: 0.2s;
        }
        .user-item:hover {
            border-color: rgba(0,255,200,0.06);
            background: rgba(0,0,0,0.3);
        }
        .user-item .info { font-size: 12px; color: #8a9aaa; }
        .user-item .info .num { color: #00ffc8; font-weight: 700; font-size: 13px; font-family: 'Share Tech Mono', monospace; }
        .user-item .info .role { color: #4a6a7a; font-size: 10px; }
        .user-item .info .name { color: #c0d8e0; font-weight: 500; }
        .user-item .info .exp { font-size: 10px; color: #4a5a6a; }

        .list-title {
            color: #4a6a7a;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-title .count { color: #4a5a6a; font-weight: 400; }

        .footer { position: relative; z-index: 2; text-align: center; font-size: 9px; color: #2a3a4a; margin-top: 18px; letter-spacing: 2px; }
        .footer span { color: #00ffc8; font-weight: 700; }

        .cyber-glow {
            position: absolute;
            top: 20%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0,255,200,0.01) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        @media(max-width:500px){ .card { padding: 24px 16px; } .header h1 { font-size: 18px; } .row { flex-direction: column; } }
    </style>
</head>
<body>

<div class="card">
    <div class="cyber-glow"></div>

    <div class="header">
        <span class="icon">⬡</span>
        <h1>PUTZZ DB</h1>
        <p><span>⚡</span> cyber database manager <span>⚡</span></p>
        <span class="badge">v2.0 · encrypted</span>
    </div>

    <div class="glitch-line"></div>

    <form id="formAdd">
        <div class="form-group">
            <label>📱 node.id</label>
            <input type="tel" id="nomor" placeholder="6281234567890" required>
        </div>
        <div class="form-group">
            <label>👤 identity</label>
            <input type="text" id="nama" placeholder="username" required>
        </div>
        <div class="form-group">
            <label>⭐ clearance</label>
            <select id="role">
                <option value="user">USER</option>
                <option value="premium">PREMIUM</option>
                <option value="admin">ADMIN</option>
                <option value="owner">OWNER</option>
            </select>
        </div>

        <div class="toggle-group" id="toggleGroup">
            <button type="button" class="toggle-btn active" data-unit="days">DAYS</button>
            <button type="button" class="toggle-btn" data-unit="hours">HOURS</button>
            <button type="button" class="toggle-btn" data-unit="minutes">MIN</button>
        </div>

        <div class="form-group">
            <label id="unitLabel">duration (days)</label>
            <input type="number" id="unitValue" placeholder="30" value="30" min="1" required>
        </div>
        <div class="form-group">
            <label>📅 timestamp</label>
            <input type="date" id="tanggal" required>
        </div>
        <button type="submit" class="btn" id="submitBtn">⏣ inject node</button>
    </form>

    <div class="status" id="status"></div>

    <div class="user-list" id="userList">
        <div class="list-title">
            <span>📡 active nodes</span>
            <span class="count" id="userCount">0</span>
        </div>
        <div id="userItems"></div>
    </div>

    <div class="footer">
        <span>PUTZZDEV</span> · cyber db v2.0
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCARA9X8ZJdtQaD_3eSCRGJDn1BzdBp_DY",
        authDomain: "nilai-2aa04.firebaseapp.com",
        databaseURL: "https://nilai-2aa04-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "nilai-2aa04",
        storageBucket: "nilai-2aa04.firebasestorage.app",
        messagingSenderId: "545147756419",
        appId: "1:545147756419:web:6ad402531002e367e8a0b6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const form = document.getElementById('formAdd');
    const nomorInput = document.getElementById('nomor');
    const namaInput = document.getElementById('nama');
    const roleSelect = document.getElementById('role');
    const unitValue = document.getElementById('unitValue');
    const unitLabel = document.getElementById('unitLabel');
    const tanggalInput = document.getElementById('tanggal');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const toggleBtns = document.querySelectorAll('.toggle-btn');
    const userItems = document.getElementById('userItems');
    const userCount = document.getElementById('userCount');

    let selectedUnit = 'days';
    let allUsers = {};

    toggleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            toggleBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedUnit = btn.dataset.unit;
            const labels = { days: 'duration (days)', hours: 'duration (hours)', minutes: 'duration (minutes)' };
            unitLabel.textContent = labels[selectedUnit];
        });
    });

    tanggalInput.value = new Date().toISOString().split('T')[0];

    function setStatus(msg, type) {
        statusDiv.textContent = msg;
        statusDiv.className = 'status ' + type;
    }

    function loadUsers() {
        db.ref('users').on('value', (snapshot) => {
            const data = snapshot.val();
            allUsers = data || {};
            renderUsers();
            localStorage.setItem('putzz_users', JSON.stringify(allUsers));
        });
    }

    function renderUsers() {
        const keys = Object.keys(allUsers);
        userCount.textContent = keys.length;

        if (keys.length === 0) {
            userItems.innerHTML = `<div style="text-align:center;color:#3a4a5a;font-size:12px;padding:16px;font-family:'Share Tech Mono',monospace;">[ empty ]</div>`;
            return;
        }

        let html = '';
        keys.forEach(key => {
            const u = allUsers[key];
            const roleEmoji = { owner: '👑', admin: '🛡️', premium: '💎', user: '◈' };
            const emoji = roleEmoji[u.role] || '◈';
            let expText = '';
            if (u.expired_days) expText = `📅 ${u.expired_days}d`;
            else if (u.expired_hours) expText = `⏰ ${u.expired_hours}h`;
            else if (u.expired_minutes) expText = `⏱️ ${u.expired_minutes}m`;

            html += `
                <div class="user-item" data-nomor="${key}">
                    <div class="info">
                        <div class="num">${key}</div>
                        <div>${emoji} <span class="name">${u.nama || '-'}</span> <span class="role">· ${(u.role || 'user').toUpperCase()}</span></div>
                        <div class="exp">${expText} · ${u.tanggal || '-'}</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-danger btn-sm" onclick="deleteUser('${key}')">✕</button>
                    </div>
                </div>
            `;
        });
        userItems.innerHTML = html;
    }

    window.deleteUser = function(nomor) {
        if (!confirm(`Remove node ${nomor}?`)) return;
        setStatus('⏳ deleting...', 'loading');
        db.ref('users/' + nomor).remove()
            .then(() => setStatus(`✅ Node ${nomor} removed.`, 'success'))
            .catch(err => setStatus('❌ Error: ' + err.message, 'error'));
    };

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nomor = nomorInput.value.trim().replace(/[^0-9]/g, '');
        const nama = namaInput.value.trim();
        const role = roleSelect.value;
        const value = parseInt(unitValue.value.trim()) || 1;
        const tanggal = tanggalInput.value;

        if (!nomor || nomor.length < 10) {
            setStatus('⚠️ invalid node.id', 'error');
            return;
        }
        if (!nama) {
            setStatus('⚠️ identity required', 'error');
            return;
        }
        if (!tanggal) {
            setStatus('⚠️ timestamp required', 'error');
            return;
        }

        submitBtn.disabled = true;
        setStatus('⏳ injecting...', 'loading');

        try {
            const data = {
                nama: nama,
                role: role,
                tanggal: tanggal,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            };

            if (selectedUnit === 'days') data.expired_days = value;
            else if (selectedUnit === 'hours') data.expired_hours = value;
            else if (selectedUnit === 'minutes') data.expired_minutes = value;

            await db.ref('users/' + nomor).set(data);

            const unitText = {
                days: `${value} days`,
                hours: `${value} hours`,
                minutes: `${value} minutes`
            };
            setStatus(`✅ ${nama} (${nomor}) · ${unitText[selectedUnit]}`, 'success');
            form.reset();
            tanggalInput.value = new Date().toISOString().split('T')[0];
        } catch (err) {
            console.error(err);
            setStatus('❌ inject failed: ' + err.message, 'error');
        } finally {
            submitBtn.disabled = false;
        }
    });

    const cached = localStorage.getItem('putzz_users');
    if (cached) { try { allUsers = JSON.parse(cached); renderUsers(); } catch(e) {} }
    loadUsers();
</script>
</body>
</html>
